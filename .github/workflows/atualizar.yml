name: Atualizar ofertas

on:
  schedule:
    - cron: '0 9,15,21 * * *' # 6h, 12h e 18h no horário de Brasília
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/atualizar.test.mjs
      - run: node scripts/atualizar.mjs
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          AMAZON_TAG: ${{ vars.AMAZON_TAG }}
      - name: Salvar produtos.json
        run: |
          git config user.name "robo-citshop"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add produtos.json
          git diff --staged --quiet || (git commit -m "Atualiza ofertas" && git push)
